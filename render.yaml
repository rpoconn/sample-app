# Render Blueprint: one Docker web service that serves the API and the built frontend.
# https://render.com/docs/blueprint-spec
services:
    - type: web
      name: daptic-jurisdictions
      runtime: docker
      dockerfilePath: ./render.Dockerfile
      dockerContext: .
      # No persistent disk on the free plan: the database resets to the seed data on every start
      plan: free
      healthCheckPath: /api/v1/utils/health-check
      envVars:
          - key: PROJECT_NAME
            value: Daptic Jurisdiction Settings
          - key: DATABASE_URL
            value: sqlite:////data/app.db
          - key: SECRET_KEY
            generateValue: true
          - key: SERVICE_API_KEY
            generateValue: true
          # Asked for in the Render dashboard when the Blueprint is created
          - key: FIRST_SUPERUSER
            sync: false
          - key: FIRST_SUPERUSER_PASSWORD
            sync: false
